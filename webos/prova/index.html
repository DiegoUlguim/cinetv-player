<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>CineTV prova</title>
<style>
  html, body { margin: 0; background: #0e0f12; color: #e8eaed; font-family: sans-serif; }
  /* Compacta: as ~30 linhas de resultado cabem em 1080 px, que o controle nao rola */
  body { padding: 24px 48px; font-size: 17px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  #estado { color: #9aa0a6; margin-bottom: 10px; width: 1400px; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  col.nome { width: 34%; } col.situacao { width: 6%; } col.detalhe { width: 60%; }
  td { padding: 3px 10px; border-bottom: 1px solid #2a2d33; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.ok { color: #6fcf9d; } td.falha { color: #ef8a7e; } td.aviso { color: #e6aa5c; }
  video { position: fixed; right: 24px; top: 16px; width: 256px; height: 144px; background: #000; }
</style>
</head>
<body>
<h1>CineTV: prova do webOS (T0)</h1>
<div id="estado">Preparando…</div>
<table><colgroup><col class="nome"><col class="situacao"><col class="detalhe"></colgroup><tbody id="resultados"></tbody></table>
<video id="video" muted></video>
<script src="mpegts.js"></script>
<!-- prova.compilado.js: prova.js compilado para o Chrome 53 (webOS 4.5) pelo npm run prova:empacotar -->
<script src="prova.compilado.js"></script>
</body>
</html>
